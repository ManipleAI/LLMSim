# Where LLMSim keeps what it writes: keys, routing, your
# rules, the suite, runs and recordings. Kept apart from deploy/k8s.yaml on
# purpose. That file is applied on every install; this one is created once and
# then left alone, since a claim cannot be changed in place and deleting it
# deletes the sign-in with it.
#
# No storage class is named, so the cluster's default is used (local-path on
# k3s). One node, one pod: ReadWriteOnce is all it needs.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llmsim-data
  labels: { app: llmsim }
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 1Gi }
