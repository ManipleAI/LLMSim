# LLMSim as a cluster service, so a gateway or a workspace pod can reach it
# by name. Namespace is passed in; nothing here is Maniple-specific.
#
#   docker build -t llmsim:dev . && docker save llmsim:dev | k3s ctr images import -
#   kubectl -n <ns> apply -f deploy/k8s-data.yaml     # once: the volume for its state
#   kubectl -n <ns> apply -f deploy/k8s.yaml
#
# deploy/install.sh does all of it, and carries over what an older LLMSim
# without a volume was holding, so nobody has to sign in again.
#
# Then point a gateway at http://llmsim.<ns>.svc:8099/<provider>
apiVersion: v1
kind: ConfigMap
metadata:
  name: llmsim-script
data:
  responses.json: |
    PLACEHOLDER
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmsim
spec:
  replicas: 1
  # One LLMSim at a time on its volume: two would write the same files and
  # the same SQLite database. A rollout stops the old pod before the new one.
  strategy: { type: Recreate, rollingUpdate: null }   # null: an older install had RollingUpdate
  selector:
    matchLabels: { app: llmsim }
  template:
    metadata:
      labels: { app: llmsim }
    spec:
      containers:
        - name: llmsim
          image: llmsim:dev
          imagePullPolicy: IfNotPresent
          env:
            - { name: LLMSIM_PORT, value: "8099" }
            - { name: LLMSIM_SCRIPT, value: /script/responses.json }
            # The ChatGPT sign-in, keys, routing, rules and runs: on the
            # volume, so a restart or a new image does not sign it out.
            - { name: LLMSIM_DATA, value: /data }
          # Who may use the console and the API (install.sh makes it). Optional, so an
          # LLMSim installed before there was a sign-in starts as it did, open.
          envFrom:
            - secretRef: { name: llmsim-access, optional: true }
          ports:
            - { name: http, containerPort: 8099 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: script, mountPath: /script }
            - { name: data, mountPath: /data }
      volumes:
        - name: script
          configMap: { name: llmsim-script }
        - name: data
          persistentVolumeClaim: { claimName: llmsim-data }
---
apiVersion: v1
kind: Service
metadata:
  name: llmsim
spec:
  selector: { app: llmsim }
  ports:
    - { name: http, port: 8099, targetPort: http }
