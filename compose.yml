services:
  llmsim:
    build: .
    ports:
      - "8099:8099"
    # Who may use the console and the API. Set in .env beside this file (copy
    # .env.example); `docker compose up` stops and says so if they are missing.
    environment:
      LLMSIM_ADMIN_USER: ${LLMSIM_ADMIN_USER:-admin}
      LLMSIM_ADMIN_PASSWORD: ${LLMSIM_ADMIN_PASSWORD:?set LLMSIM_ADMIN_PASSWORD in .env (copy .env.example)}
      LLMSIM_API_KEY: ${LLMSIM_API_KEY:?set LLMSIM_API_KEY in .env (copy .env.example)}
    volumes:
      # Bind-mounted so a script edit needs a restart, not a rebuild.
      - ./responses.json:/app/responses.json:ro
      # Sign-ins, keys, routing and rules: kept across `down` and `up`.
      - llmsim-data:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8099/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  llmsim-data:
