name: Feature request
description: Something LLMSim should do that it does not.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to test?
      description: The situation first, before the solution. What does your agent or client do, and what is hard to check today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like LLMSim to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
